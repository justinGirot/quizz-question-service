databaseChangeLog:
  - changeSet:
      id: 001-create-questions-table
      author: question-service
      changes:
        - createTable:
            tableName: questions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: text
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: DRAFT
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: difficulty
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: points
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: BIGINT
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_question_status
            tableName: questions
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_question_category
            tableName: questions
            columns:
              - column:
                  name: category

        - createIndex:
            indexName: idx_question_created_by
            tableName: questions
            columns:
              - column:
                  name: created_by
