databaseChangeLog:
  - changeSet:
      id: 002-create-answers-table
      author: question-service
      changes:
        - createTable:
            tableName: answers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: text
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: is_correct
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(500)
              - column:
                  name: question_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: answers
            baseColumnNames: question_id
            constraintName: fk_answer_question
            referencedTableName: questions
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_answer_question_id
            tableName: answers
            columns:
              - column:
                  name: question_id
