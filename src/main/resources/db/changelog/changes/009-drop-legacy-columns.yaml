databaseChangeLog:
  - changeSet:
      id: 009-drop-legacy-columns
      author: question-service
      changes:
        # Drop legacy category column (now using category_id FK)
        - dropColumn:
            tableName: questions
            columnName: category

        # Drop legacy difficulty column (now using difficulty_level_id FK)
        - dropColumn:
            tableName: questions
            columnName: difficulty

        # Drop the old index on category since the column is gone
        # Note: Some databases automatically drop indexes when dropping columns
        # So we skip this if the index doesn't exist
