databaseChangeLog:
  - changeSet:
      id: 003-create-categories-table
      author: question-service
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: BIGINT
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_category_status
            tableName: categories
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_category_name
            tableName: categories
            unique: true
            columns:
              - column:
                  name: name

        # Insert default categories
        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: Science
              - column:
                  name: description
                  value: Science and technology questions
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: created_by
                  value: 1

        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: History
              - column:
                  name: description
                  value: Historical events and figures
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: created_by
                  value: 1

        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: Geography
              - column:
                  name: description
                  value: World geography and locations
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: created_by
                  value: 1

        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: Sports
              - column:
                  name: description
                  value: Sports and athletics
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: created_by
                  value: 1

        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: Arts
              - column:
                  name: description
                  value: Arts, music, and culture
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: created_by
                  value: 1
