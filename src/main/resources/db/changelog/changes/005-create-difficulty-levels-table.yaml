databaseChangeLog:
  - changeSet:
      id: 005-create-difficulty-levels-table
      author: question-service
      changes:
        - createTable:
            tableName: difficulty_levels
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: display_order
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: points_multiplier
                  type: DOUBLE
                  defaultValue: 1.0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_difficulty_level_name
            tableName: difficulty_levels
            unique: true
            columns:
              - column:
                  name: name

        - createIndex:
            indexName: idx_difficulty_level_display_order
            tableName: difficulty_levels
            columns:
              - column:
                  name: display_order

        # Insert default difficulty levels
        - insert:
            tableName: difficulty_levels
            columns:
              - column:
                  name: name
                  value: Easy
              - column:
                  name: description
                  value: Questions suitable for beginners
              - column:
                  name: display_order
                  value: 1
              - column:
                  name: points_multiplier
                  value: 1.0

        - insert:
            tableName: difficulty_levels
            columns:
              - column:
                  name: name
                  value: Medium
              - column:
                  name: description
                  value: Questions of moderate difficulty
              - column:
                  name: display_order
                  value: 2
              - column:
                  name: points_multiplier
                  value: 1.5

        - insert:
            tableName: difficulty_levels
            columns:
              - column:
                  name: name
                  value: Hard
              - column:
                  name: description
                  value: Challenging questions for advanced players
              - column:
                  name: display_order
                  value: 3
              - column:
                  name: points_multiplier
                  value: 2.0
